<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile camp detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}} width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--background); color: var(--foreground); font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 6px; height: 60px; padding: 0 12px 0 6px; background: var(--card); border-bottom: 1px solid var(--border); flex: none">
    <a href="Camps.dc.html" aria-label="Back to camps" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--foreground)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0"><strong style="font-size: 16px">Al Quoz Camp 3</strong><span style="font-size: 11.5px; color: var(--muted-foreground)">Dubai · 312 beds · 93% in use</span></div>
    <button type="button" aria-label="Camp actions" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
  </header>
  <div style="flex: none; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--card); border-bottom: 1px solid var(--border)">
    <div style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--muted); gap: 2px"><div style="width: 85.9%; background: var(--status-occupied)"></div><div style="width: 7.05%; background: var(--status-held)"></div><div style="width: 7.05%; background: var(--status-vacant)"></div></div>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--input); background: var(--background); color: var(--muted-foreground)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="search" placeholder="Room, worker or Emp No" aria-label="Search rooms" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: var(--foreground)"></label>
    <div style="display: flex; gap: 6px; font-size: 11.5px; font-weight: 700">
      <span style="padding: 4px 9px; border-radius: 999px; background: var(--status-occupied-bg); color: var(--status-occupied-fg); border: 1px solid var(--status-occupied-border)">268 occ.</span>
      <span style="padding: 4px 9px; border-radius: 999px; background: var(--status-held-bg); color: var(--status-held-fg); border: 1px solid var(--status-held-border)">22 held</span>
      <span style="padding: 4px 9px; border-radius: 999px; background: var(--status-vacant-bg); color: var(--status-vacant-fg); border: 1px solid var(--status-vacant-border)">22 vacant</span>
    </div>
  </div>
  <main style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="2">
      <article style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border)">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px"><div style="display: flex; flex-direction: column"><h2 style="margin: 0; font-size: 16px; font-weight: 700">Room {{r.num}}</h2><span style="font-size: 12px; color: var(--muted-foreground)">{{r.sum}}</span></div><button type="button" aria-label="Room {{r.num}} actions" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{r.beds}}" as="b" hint-placeholder-count="9">
            <a href="MobileBed.dc.html" style="{{b.style}}"><span style="display: flex; justify-content: space-between"><span style="font-size: 13px; font-weight: 800">{{b.label}}</span><span style="font-size: 10.5px; font-weight: 600; opacity: .85">{{b.type}}</span></span><span style="font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.who}}</span></a>
          </sc-for>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const XC_L='background:#F5F7FA;foreground:#0E1B2C;card:#FFFFFF;primary:#00579F;muted:#EEF1F5;muted-foreground:#556274;border:#DCE2EA;input:#C9D2DE;status-occupied:#2A8BD6;status-occupied-bg:#E5F1FC;status-occupied-border:#8FC2EE;status-occupied-fg:#0B4C85;status-held:#DDA00F;status-held-bg:#FCF1D2;status-held-border:#E6BA4C;status-held-fg:#694000;status-vacant:#23A162;status-vacant-bg:#E2F4EA;status-vacant-border:#84CDA4;status-vacant-fg:#0B5C33';
const XC_D='background:#0A111C;foreground:#E5ECF5;card:#101A28;primary:#4D9DE8;muted:#152234;muted-foreground:#93A2B6;border:#213149;input:#2A3D58;status-occupied:#4BA8F0;status-occupied-bg:#0F2A45;status-occupied-border:#2B679F;status-occupied-fg:#A6D3FA;status-held:#E8B53A;status-held-bg:#33270B;status-held-border:#866619;status-held-fg:#F6D57A;status-vacant:#3CC27F;status-vacant-bg:#0D2F21;status-vacant-border:#2A7650;status-vacant-fg:#93E3B9';
function xcVars(d){return (d?XC_D:XC_L).split(';').map(function(s){return '--'+s;}).join(';')+';color-scheme:'+(d?'dark':'light')+';';}
var S = { o: 'background: var(--status-occupied-bg); border: 1px solid var(--status-occupied-border); color: var(--status-occupied-fg);', h: 'background: var(--status-held-bg); border: 1px solid var(--status-held-border); color: var(--status-held-fg);', v: 'background: var(--status-vacant-bg); border: 1px solid var(--status-vacant-border); color: var(--status-vacant-fg);' };
var T = { L: 'Lower', U: 'Upper', S: 'Single' };
function beds(spec) { return spec.split('|').map(function (s) { var p = s.split(','); return { label: p[0], type: T[p[1]], who: p[2] === 'v' ? 'Vacant' : p[3], style: 'display: flex; flex-direction: column; gap: 3px; min-width: 0; min-height: 52px; box-sizing: border-box; padding: 8px 9px; border-radius: 9px; text-decoration: none; ' + S[p[2]] }; }); }
class Component extends DCLogic {
  renderVals() {
    return {
      tv: xcVars(this.props.dark ?? false),
      rooms: [
        { num: '101', sum: '7 occupied · 1 held · 1 vacant · 35 m²', beds: beds('B1,L,o,Ram Prasad A.|B2,U,h,Ram Bahadur T.|B3,L,o,Mohan S.|B4,U,o,Dipak K.|B5,L,o,Hari B.|B6,U,o,Nabin P.|B7,L,v|B8,U,o,Sunil M.|B9,S,o,Krishna G.') },
        { num: '103', sum: '4 occupied · 2 vacant · 24 m²', beds: beds('B1,S,o,Vijay N.|B2,S,o,Rakesh T.|B3,S,v|B4,S,v|B5,S,o,Deepak R.|B6,S,o,Ajay M.') }
      ]
    };
  }
}
</script>
</body>
</html>
