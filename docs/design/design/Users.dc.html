<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}} min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--background); color: var(--foreground); font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif">
  <div style="flex: 0 0 248px; display: flex; flex-direction: column"><dc-import name="Sidebar" active="users" dark="{{dark}}" hint-size="248px,100%"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Topbar" crumbs="Administration / Users" dark="{{dark}}" hint-size="100%,64px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1440px; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 800; letter-spacing: -0.02em">Users</h1>
          <p style="margin: 0; font-size: 14px; color: var(--muted-foreground)">Staff who can sign in · 5 active, 1 deactivated</p>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <label style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; width: 260px; border-radius: 8px; border: 1px solid var(--input); background: var(--card); color: var(--muted-foreground)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="search" placeholder="Search name or email" aria-label="Search users" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: var(--foreground)"></label>
          <a href="RoleEditor.dc.html" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); text-decoration: none; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New user</a>
        </div>
      </div>
      <div style="border-radius: 14px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow-x: auto">
        <table style="width: 100%; min-width: 900px; border-collapse: collapse; font-size: 13.5px">
          <thead><tr style="background: var(--muted); text-align: left; color: var(--muted-foreground)">
            <th scope="col" style="padding: 10px 16px; font-size: 12px; font-weight: 600">User</th>
            <th scope="col" style="padding: 10px 16px; font-size: 12px; font-weight: 600">Role</th>
            <th scope="col" style="padding: 10px 16px; font-size: 12px; font-weight: 600">Camps</th>
            <th scope="col" style="padding: 10px 16px; font-size: 12px; font-weight: 600">Status</th>
            <th scope="col" style="padding: 10px 16px; font-size: 12px; font-weight: 600; text-align: right">Actions</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{users}}" as="u" hint-placeholder-count="6">
              <tr style="{{u.row}}">
                <td style="padding: 12px 16px"><div style="display: flex; align-items: center; gap: 12px"><div style="{{u.av}}">{{u.ini}}</div><div style="display: flex; flex-direction: column"><span style="font-weight: 600">{{u.name}} <span style="font-weight: 500; color: var(--muted-foreground)">{{u.you}}</span></span><span style="font-size: 12.5px; color: var(--muted-foreground)">{{u.email}}</span></div></div></td>
                <td style="padding: 12px 16px"><span style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600"><sc-if value="{{u.locked}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Locked role" style="color: var(--muted-foreground)"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></sc-if>{{u.role}}</span></td>
                <td style="padding: 12px 16px"><div style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{u.camps}}" as="c" hint-placeholder-count="1"><span style="{{u.campStyle}}">{{c}}</span></sc-for></div></td>
                <td style="padding: 12px 16px"><span style="{{u.statusStyle}}">{{u.status}}</span></td>
                <td style="padding: 10px 16px"><div style="display: flex; justify-content: flex-end; gap: 6px">
                  <a href="RoleEditor.dc.html" style="height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 7px; border: 1px solid var(--border); color: var(--foreground); text-decoration: none; font-size: 12.5px; font-weight: 600">Edit</a>
                  <a href="RoleEditor.dc.html" style="height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 7px; border: 1px solid var(--border); color: var(--foreground); text-decoration: none; font-size: 12.5px; font-weight: 600"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/></svg>Password</a>
                  <button type="button" disabled="{{u.self}}" title="{{u.tip}}" style="{{u.toggleStyle}}">{{u.toggle}}</button>
                </div></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
const XC_L='background:#F5F7FA;foreground:#0E1B2C;card:#FFFFFF;primary:#00579F;primary-foreground:#FFFFFF;secondary:#E9EFF6;secondary-foreground:#0E2A4A;muted:#EEF1F5;muted-foreground:#556274;accent:#FFF1DC;accent-foreground:#8A4A00;destructive:#C2302A;border:#DCE2EA;input:#C9D2DE;row-exited:#F2F3F5;status-vacant-bg:#E2F4EA;status-vacant-border:#84CDA4;status-vacant-fg:#0B5C33;shadow-sm:0 1px 2px rgba(14,27,44,.06),0 1px 3px rgba(14,27,44,.05)';
const XC_D='background:#0A111C;foreground:#E5ECF5;card:#101A28;primary:#4D9DE8;primary-foreground:#04111F;secondary:#18263A;secondary-foreground:#DCE6F2;muted:#152234;muted-foreground:#93A2B6;accent:#33240E;accent-foreground:#FFC47A;destructive:#EF6A5F;border:#213149;input:#2A3D58;row-exited:#0E1520;status-vacant-bg:#0D2F21;status-vacant-border:#2A7650;status-vacant-fg:#93E3B9;shadow-sm:0 1px 2px rgba(0,0,0,.4)';
function xcVars(d){return (d?XC_D:XC_L).split(';').map(function(s){return '--'+s;}).join(';')+';color-scheme:'+(d?'dark':'light')+';';}
var P = 'display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; ';
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var U = [
      ['MA', 'Mariam Al Hashimi', 'mariam.hashimi@xperts.ae', 'Administrator', ['All camps'], true, true, true],
      ['AN', 'Aisha Noor', 'aisha.noor@xperts.ae', 'HR Operations', ['All camps'], true],
      ['RK', 'Rajesh Kumar', 'rajesh.kumar@xperts.ae', 'Camp Supervisor', ['Al Quoz Camp 3', 'Sonapur Camp 7'], true],
      ['YH', 'Yusuf Haddad', 'yusuf.haddad@xperts.ae', 'Camp Supervisor', ['Mussafah M-12'], true],
      ['PM', 'Priya Menon', 'priya.menon@xperts.ae', 'Reports Viewer', ['All camps'], true],
      ['OS', 'Omar Saleh', 'omar.saleh@xperts.ae', 'Camp Supervisor', ['Jebel Ali Labour Camp'], false]
    ];
    var users = U.map(function (u) {
      var act = u[5], self = !!u[6], all = u[4][0] === 'All camps';
      return {
        ini: u[0], name: u[1], email: u[2], role: u[3], camps: u[4], you: self ? '(you)' : '', locked: !!u[7], self: self,
        tip: self ? 'You can’t deactivate your own account' : '',
        row: 'border-top: 1px solid var(--border);' + (act ? '' : ' background: var(--row-exited); color: var(--muted-foreground);'),
        av: 'width: 34px; height: 34px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; ' + (act ? 'background: var(--secondary); color: var(--secondary-foreground);' : 'background: var(--muted); color: var(--muted-foreground);'),
        campStyle: all ? 'font-weight: 600' : P + 'font-weight: 600; background: var(--muted); color: var(--foreground); border: 1px solid var(--border)',
        status: act ? 'Active' : 'Deactivated',
        statusStyle: P + (act ? 'background: var(--status-vacant-bg); color: var(--status-vacant-fg); border: 1px solid var(--status-vacant-border)' : 'background: var(--muted); color: var(--muted-foreground); border: 1px solid var(--border)'),
        toggle: act ? 'Deactivate' : 'Activate',
        toggleStyle: 'height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid ' + (act ? 'transparent' : 'var(--primary)') + '; background: transparent; color: ' + (act ? 'var(--destructive)' : 'var(--primary)') + '; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;' + (self ? ' opacity: .4; cursor: not-allowed;' : '')
      };
    });
    return { dark: dark, tv: xcVars(dark), users: users };
  }
}
</script>
</body>
</html>
