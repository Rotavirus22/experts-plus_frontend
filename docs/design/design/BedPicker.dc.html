<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bed picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}} position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="Workers" dark="{{dark}}" hint-size="1440px,1360px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: var(--overlay)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="bp-title" style="position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: 760px; max-height: 888px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 16px; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: var(--shadow-lg)">
    <div style="padding: 22px 24px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 id="bp-title" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Assign a bed to Anil Kumar</h2>
        <p style="margin: 0; font-size: 13.5px; color: var(--muted-foreground)"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace">XP-004021</span> · Plumber · currently has no bed</p>
      </div>
      <button type="button" aria-label="Close" style="width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>

    <div style="padding: 0 24px 14px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 10px; align-items: end">
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600">Camp</span><button type="button" style="height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-radius: 8px; border: 1px solid var(--input); background: var(--card); color: var(--foreground); font: inherit; font-size: 14px; cursor: pointer">Al Quoz Camp 3 · Dubai<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="rf" style="font-size: 13px; font-weight: 600">Room</label><input id="rf" placeholder="Filter rooms, e.g. 10 or G-" style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid var(--input); background: var(--card); color: var(--foreground); font: inherit; font-size: 14px"></div>
      <div style="height: 38px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; background: var(--status-vacant-bg); color: var(--status-vacant-fg); font-size: 13px; font-weight: 700; white-space: nowrap">22 vacant beds</div>
    </div>

    <div style="margin: 0 24px; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; max-height: 430px">
      <div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 14px; background: var(--muted); font-size: 12px; color: var(--muted-foreground)">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: var(--status-vacant-bg); border: 1px solid var(--status-vacant-border)"></span>Vacant · selectable</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: var(--status-occupied-bg); border: 1px solid var(--status-occupied-border); opacity: .6"></span>Occupied</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: var(--status-held-bg); border: 1px solid var(--status-held-border); opacity: .6"></span>Held</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: var(--primary)"></span>Selected</span>
      </div>
      <sc-for list="{{rooms}}" as="r" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--card)">
          <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Room {{r.num}}</span><span style="font-size: 12px; color: var(--muted-foreground)">{{r.vac}} vacant of {{r.total}}</span></div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{r.beds}}" as="b" hint-placeholder-count="8">
              <button type="button" disabled="{{b.disabled}}" aria-pressed="{{b.sel}}" title="{{b.tip}}" style="{{b.style}}">{{b.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="padding: 16px 24px 0; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: stretch">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="dt" style="font-size: 13px; font-weight: 600">From date</label><div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--input); background: var(--card)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted-foreground)"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><input id="dt" value="3 Oct 2026" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: var(--foreground)"></div></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: color-mix(in oklab, var(--primary) 8%, var(--card)); border: 1px solid color-mix(in oklab, var(--primary) 30%, var(--border))">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--primary); flex: none"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>
        <div style="font-size: 13px; line-height: 19px"><strong>Anil Kumar</strong> → Al Quoz Camp 3 · <strong>Room 101 · B7</strong> (bunk lower)<br><span style="color: var(--muted-foreground)">from 3 Oct 2026</span></div>
      </div>
    </div>

    <div style="padding: 18px 24px 22px; display: flex; justify-content: flex-end; gap: 8px">
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Cancel</button>
      <a href="States.dc.html" style="height: 40px; padding: 0 18px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700">Assign bed</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
const XC_L='background:#F5F7FA;foreground:#0E1B2C;card:#FFFFFF;card-foreground:#0E1B2C;popover:#FFFFFF;popover-foreground:#0E1B2C;primary:#00579F;primary-foreground:#FFFFFF;secondary:#E9EFF6;secondary-foreground:#0E2A4A;muted:#EEF1F5;muted-foreground:#556274;destructive:#C2302A;border:#DCE2EA;input:#C9D2DE;ring:#3584CF;status-occupied-bg:#E5F1FC;status-occupied-border:#8FC2EE;status-occupied-fg:#0B4C85;status-held-bg:#FCF1D2;status-held-border:#E6BA4C;status-held-fg:#694000;status-vacant-bg:#E2F4EA;status-vacant-border:#84CDA4;status-vacant-fg:#0B5C33;shadow-lg:0 24px 48px rgba(14,27,44,.18),0 4px 12px rgba(14,27,44,.08);overlay:rgba(10,20,35,.48)';
const XC_D='background:#0A111C;foreground:#E5ECF5;card:#101A28;card-foreground:#E5ECF5;popover:#132034;popover-foreground:#E5ECF5;primary:#4D9DE8;primary-foreground:#04111F;secondary:#18263A;secondary-foreground:#DCE6F2;muted:#152234;muted-foreground:#93A2B6;destructive:#EF6A5F;border:#213149;input:#2A3D58;ring:#4D9DE8;status-occupied-bg:#0F2A45;status-occupied-border:#2B679F;status-occupied-fg:#A6D3FA;status-held-bg:#33270B;status-held-border:#866619;status-held-fg:#F6D57A;status-vacant-bg:#0D2F21;status-vacant-border:#2A7650;status-vacant-fg:#93E3B9;shadow-lg:0 24px 60px rgba(0,0,0,.6);overlay:rgba(2,6,12,.66)';
function xcVars(d){return (d?XC_D:XC_L).split(';').map(function(s){return '--'+s;}).join(';')+';color-scheme:'+(d?'dark':'light')+';';}
var CH = 'min-width: 46px; height: 32px; padding: 0 10px; border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 700; ';
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var R = [['101', 'ohoooovoo'], ['102', 'ooooovoh'], ['103', 'oovvoo'], ['104', 'ooo-vvoh'], ['201', 'oovvvvvv']];
    var rooms = R.map(function (r) {
      var beds = r[1].split('').map(function (s, i) {
        var label = 'B' + (i + 1);
        var sel = r[0] === '101' && s === 'v';
        if (s === '-') return null;
        var st = { o: 'background: var(--status-occupied-bg); border: 1px solid var(--status-occupied-border); color: var(--status-occupied-fg); opacity: .55; cursor: not-allowed;', h: 'background: var(--status-held-bg); border: 1px solid var(--status-held-border); color: var(--status-held-fg); opacity: .55; cursor: not-allowed;', v: 'background: var(--status-vacant-bg); border: 1px solid var(--status-vacant-border); color: var(--status-vacant-fg); cursor: pointer;' }[s];
        if (sel) st = 'background: var(--primary); border: 1px solid var(--primary); color: var(--primary-foreground); cursor: pointer; box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 25%, transparent);';
        return { label: label, sel: sel, disabled: s !== 'v', tip: { o: 'Occupied', h: 'Held — occupant on leave', v: 'Vacant' }[s], style: CH + st };
      }).filter(Boolean);
      return { num: r[0], beds: beds, total: beds.length, vac: beds.filter(function (b) { return !b.disabled; }).length };
    });
    return { dark: dark, tv: xcVars(dark), rooms: rooms };
  }
}
</script>
</body>
</html>
