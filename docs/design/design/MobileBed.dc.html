<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile bed sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}} position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><dc-import name="MobileCamp" dark="{{dark}}" hint-size="390px,844px"></dc-import></div>
  <div style="position: absolute; inset: 0; background: var(--overlay)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="mb-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; box-sizing: border-box; border-radius: 20px 20px 0 0; background: var(--card); box-shadow: var(--shadow-lg); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 40px; height: 5px; border-radius: 999px; background: var(--border)"></span></div>
    <div style="padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border)">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
        <div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: var(--muted-foreground); font-weight: 600">Al Quoz Camp 3</span><h2 id="mb-title" style="margin: 0; font-size: 21px; font-weight: 800">Room 101 · B7</h2></div>
        <button type="button" aria-label="Close" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div style="display: flex; gap: 6px"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--status-vacant-bg); color: var(--status-vacant-fg); border: 1px solid var(--status-vacant-border)">Vacant</span><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--secondary); color: var(--secondary-foreground)">Bunk lower</span></div>
    </div>
    <div style="flex: 1; overflow: hidden; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px">
      <h3 style="margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .06em">Put a worker in this bed</h3>
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--input); background: var(--background); color: var(--muted-foreground)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="search" placeholder="Name or Emp No" aria-label="Search workers" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15px; color: var(--foreground)"></label>
      <div role="radiogroup" aria-label="Candidates" style="display: flex; flex-direction: column; border-radius: 12px; border: 1px solid var(--border); overflow: hidden">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; background: color-mix(in oklab, var(--primary) 9%, var(--card)); box-shadow: inset 0 0 0 1.5px var(--primary)"><input type="radio" name="c" checked="checked" style="width: 18px; height: 18px; margin: 0; accent-color: var(--primary)"><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14.5px">Anil Kumar</strong><span style="font-size: 12px; color: var(--muted-foreground)">XP-004021 · Plumber</span></span><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warning-bg); color: var(--warning-fg)">No bed</span></label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-top: 1px solid var(--border)"><input type="radio" name="c" style="width: 18px; height: 18px; margin: 0; accent-color: var(--primary)"><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14.5px">Shahid Mehmood</strong><span style="font-size: 12px; color: var(--muted-foreground)">XP-004290 · Forklift Operator</span></span><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warning-bg); color: var(--warning-fg)">No bed</span></label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-top: 1px solid var(--border)"><input type="radio" name="c" style="width: 18px; height: 18px; margin: 0; accent-color: var(--primary)"><span style="flex: 1; display: flex; flex-direction: column"><strong style="font-size: 14.5px">Bikash Tamang</strong><span style="font-size: 12px; color: var(--muted-foreground)">Now in Room 204 · B3</span></span><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--status-occupied-bg); color: var(--status-occupied-fg)">Move</span></label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="d" style="font-size: 13px; font-weight: 600">In this bed from</label><input id="d" value="3 Oct 2026" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid var(--input); background: var(--card); color: var(--foreground); font: inherit; font-size: 15px"></div>
      <a href="States.dc.html" style="height: 48px; border-radius: 10px; background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700">Assign Anil Kumar to B7</a>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 4px; font-size: 13px"><a href="BedDrawer.dc.html" style="font-weight: 600; text-decoration: none">Bed history (2)</a><a href="CampDialogs.dc.html" style="color: var(--destructive); font-weight: 600; text-decoration: none">Invalidate bed…</a></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const XC_L='background:#F5F7FA;foreground:#0E1B2C;card:#FFFFFF;primary:#00579F;primary-foreground:#FFFFFF;secondary:#E9EFF6;secondary-foreground:#0E2A4A;muted-foreground:#556274;destructive:#C2302A;border:#DCE2EA;input:#C9D2DE;status-occupied-bg:#E5F1FC;status-occupied-fg:#0B4C85;status-vacant-bg:#E2F4EA;status-vacant-border:#84CDA4;status-vacant-fg:#0B5C33;warning-bg:#FFF3DE;warning-fg:#7A4400;shadow-lg:0 -12px 40px rgba(14,27,44,.2);overlay:rgba(10,20,35,.48)';
const XC_D='background:#0A111C;foreground:#E5ECF5;card:#101A28;primary:#4D9DE8;primary-foreground:#04111F;secondary:#18263A;secondary-foreground:#DCE6F2;muted-foreground:#93A2B6;destructive:#EF6A5F;border:#213149;input:#2A3D58;status-occupied-bg:#0F2A45;status-occupied-fg:#A6D3FA;status-vacant-bg:#0D2F21;status-vacant-border:#2A7650;status-vacant-fg:#93E3B9;warning-bg:#2F210B;warning-fg:#FFCE85;shadow-lg:0 -12px 40px rgba(0,0,0,.6);overlay:rgba(2,6,12,.66)';
function xcVars(d){return (d?XC_D:XC_L).split(';').map(function(s){return '--'+s;}).join(';')+';color-scheme:'+(d?'dark':'light')+';';}
class Component extends DCLogic {
  renderVals() { var dark = this.props.dark ?? false; return { dark: dark, tv: xcVars(dark) }; }
}
</script>
</body>
</html>
